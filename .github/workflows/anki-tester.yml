name: Anki tester
on:
  push:
    branches: [codex/anki-tester, main]
    paths: ['addon/**', 'tests/**', 'tools/**', 'outputs/french_vocabulary_b1_c1.csv', 'docs/VERIFICATION.md', '.github/workflows/anki-tester.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libnss3 libasound2t64
      - name: Install Anki test dependencies
        run: python -m pip install anki==26.9.3 aqt==26.9.3 pytest==8.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install card DOM test dependency
        run: npm install --no-save jsdom@22.1.0
      - name: Compile all Python files
        run: python -m compileall -q addon tools tests
      - name: Run policy and real Anki collection tests
        run: python -m pytest tests -q
      - name: Exercise all card interfaces
        run: node tests/test_frontend.cjs
      - name: Audit unchanged source vocabulary
        run: python tools/audit_sources.py --out dist/source_audit.json
      - name: Build installable add-on
        run: python tools/build_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: comuls-anki-tester
          path: dist/*
          if-no-files-found: error

  release:
    needs: verify
    if: github.ref == 'refs/heads/codex/anki-tester' && startsWith(github.event.head_commit.message, 'Release Anki tester')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: comuls-anki-tester
          path: dist
      - name: Publish downloadable tester
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "tester-0.1.$GITHUB_RUN_NUMBER" dist/comuls-tester.ankiaddon dist/SHA256SUMS dist/source_audit.json --prerelease --target "$GITHUB_SHA" --title "COMULS Anki tester 0.1.$GITHUB_RUN_NUMBER" --notes-file docs/TESTER_RELEASE.md
